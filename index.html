<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#190542">
<title>SPOT — Твой ритм. Твои люди.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--violet:#190542;--white:#FFFFFF;--teal:#20C9C3;--orange:#FF7D20;--peach:#F8C097;--emerald:#00A878;--gray:#6B6385;--bg:#FBF7F4;--line:rgba(25,5,66,.09);--ease:cubic-bezier(.2,.8,.2,1)}
html,body{height:100%;background:#E8E2EE;font-family:"TT Bluescreens Pro",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--violet);overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
svg{display:block}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
@media(min-width:500px) and (min-height:780px){#app{height:min(844px,96vh);width:390px;border-radius:46px;border:8px solid var(--violet);box-shadow:0 40px 90px rgba(25,5,66,.28)}}
::-webkit-scrollbar{display:none}
/* common */
.screen{position:absolute;inset:0}
.hide{display:none!important}
h1{font-size:32px;letter-spacing:-.03em;font-weight:750;line-height:1.08}
h2{font-size:20px;letter-spacing:-.02em;font-weight:700}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);font-weight:650;margin:26px 0 10px}
.sub{color:var(--gray);font-size:15px;line-height:1.4;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:18px;background:var(--violet);color:#fff;font-weight:650;font-size:16px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.cta{background:var(--orange);color:var(--violet);box-shadow:0 12px 24px -12px rgba(255,125,32,.75)}
.btn.ghost{background:#fff;color:var(--violet);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:#fff;color:var(--violet);box-shadow:inset 0 0 0 1.5px rgba(25,5,66,.35)}
.btn.sm{height:42px;border-radius:14px;font-size:14px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.pad{padding:18px 20px 30px}
.row{display:flex;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:#fff;font-size:14px;font-weight:550;box-shadow:inset 0 0 0 1px var(--line);transition:all .2s var(--ease)}
.chip.on{background:var(--teal);color:var(--violet);box-shadow:none}
.chip.static{cursor:default;background:rgba(25,5,66,.06);box-shadow:none;font-size:13px;padding:7px 12px}
.chip.static.hl{background:rgba(248,192,151,.6)}
.ico{display:inline-flex}
/* logo */
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:19px;letter-spacing:.24em;font-weight:800}
/* onboarding */
#onboard,#auth,#welcome{isolation:isolate;background:var(--violet);color:#fff;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 26px calc(26px + env(safe-area-inset-bottom));overflow-y:auto;z-index:50}
#onboard .glow,#auth .glow,#welcome .glow{position:absolute;right:-120px;top:-100px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(32,201,195,.35),transparent 68%);pointer-events:none}
#onboard .logo b,#auth .logo b,#welcome .logo b{color:#fff}
#onboard:after,#auth:after,#welcome:after{content:"";position:absolute;left:-150px;bottom:-130px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,125,32,.24),transparent 68%);pointer-events:none;z-index:-1}
.ob-mid{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;padding:20px 0}
.ob-mid h1{font-size:44px;line-height:1.02;letter-spacing:-.04em}
.ob-mid h1 em{font-style:normal;color:var(--teal)}
.ob-mid p{color:rgba(255,255,255,.64);font-size:16px;line-height:1.5;margin-top:18px}
.ob-feats{margin-top:26px;display:grid;gap:12px}
.ob-feats div{display:flex;gap:12px;align-items:center;font-size:14.5px;color:rgba(255,255,255,.86)}
.ob-feats i{flex:none;width:34px;height:34px;border-radius:11px;background:rgba(32,201,195,.14);color:var(--teal);display:grid;place-items:center}
.ob-dots{display:flex;gap:6px;margin-bottom:16px}
.ob-dots i{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.18)}
.ob-dots i.on{background:var(--teal)}
#onboard .chip{background:rgba(255,255,255,.08);box-shadow:none;color:#fff}
#onboard .chip.on{background:var(--teal);color:var(--violet)}
.clublist{display:grid;gap:8px;margin-top:14px}
.clubbtn{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.07);font-weight:600;text-align:left}
.clubbtn.on{background:var(--teal);color:var(--violet)}
.ob-note{font-size:12.5px;color:rgba(255,255,255,.5);line-height:1.45;margin-top:14px}
/* tabs */
.tab{position:absolute;left:0;right:0;top:0;bottom:calc(74px + env(safe-area-inset-bottom));overflow-y:auto;display:none;overscroll-behavior:contain}
.tab.on{display:block;animation:tin .38s var(--ease)}
#t-discover.on{display:flex;flex-direction:column;overflow:hidden}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(74px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:20}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gray);font-size:10.5px;font-weight:600;position:relative;transition:color .2s}
#tabbar button.on{color:var(--violet)}
#tabbar button.on .ti{background:var(--teal);color:var(--violet)}
.ti{width:44px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s var(--ease)}
.badge{position:absolute;top:7px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--orange);color:var(--violet);font-weight:800;font-size:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;box-sizing:content-box}
.badge:empty,.badge.z{display:none}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)*0) 20px 10px;min-height:56px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#fff;font-size:12.5px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--emerald)}
/* discover */
.deck{flex:1;min-height:0;padding:0 14px;position:relative}
.card{height:100%;background:#fff;border-radius:30px;overflow-y:auto;overflow-x:hidden;position:relative;box-shadow:0 1px 0 var(--line),0 18px 40px -22px rgba(25,5,66,.25);touch-action:pan-y;will-change:transform;overscroll-behavior:contain}
.card.enter{animation:cin .45s var(--ease)}
@keyframes cin{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.hero{height:190px;position:relative;overflow:hidden;background:var(--violet)}
.hero svg{width:100%;height:100%}
.score{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;background:var(--teal);color:var(--violet);padding:7px 13px 7px 8px;border-radius:999px;font-weight:700;font-size:13px}
.score s{text-decoration:none;display:grid;place-items:center;height:26px;min-width:26px;padding:0 6px;border-radius:13px;background:var(--violet);color:var(--teal);font-size:12px}
.stamp{position:absolute;top:16px;padding:6px 14px;border-radius:10px;font-weight:800;letter-spacing:.1em;font-size:15px;opacity:0;border:3px solid;z-index:3;pointer-events:none;background:rgba(255,255,255,.9)}
.stamp.l{right:16px;color:var(--emerald);border-color:var(--emerald);transform:rotate(8deg)}
.stamp.p{left:16px;color:var(--gray);border-color:var(--gray);transform:rotate(-8deg)}
.cbody{padding:18px 20px 22px}
.cname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cname h2{font-size:28px;letter-spacing:-.03em}
.cname span{font-size:22px;color:var(--gray);font-weight:400}
.cclub{color:var(--gray);font-size:13.5px;margin-top:4px}
.why{margin-top:16px;background:var(--violet);color:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.why:before{content:"";position:absolute;right:-50px;top:-50px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(32,201,195,.32),transparent 70%)}
.why h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700;position:relative}
.rs{display:grid;gap:9px;margin-top:12px;position:relative}
.rs div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.35}
.rs i{flex:none;color:var(--teal);margin-top:1px}
.rs div.dim{color:rgba(255,255,255,.55)}
.mg{display:grid;grid-template-columns:30px repeat(7,1fr);gap:5px;margin-top:14px;align-items:center;position:relative}
.mg u{text-decoration:none;font-size:10px;color:rgba(255,255,255,.45);text-align:center}
.mg u.rl{text-align:left}
.mg i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.07);max-width:22px;width:100%;margin:0 auto}
.mg i.me{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.mg i.them{background:rgba(255,255,255,.34)}
.mg i.both{background:var(--teal);box-shadow:0 0 12px rgba(32,201,195,.7)}
.legend{display:flex;gap:12px;font-size:10.5px;color:rgba(255,255,255,.5);margin-top:10px;position:relative}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.bio{font-size:15.5px;line-height:1.5;margin-top:16px;color:#2E2354}
.actions{display:flex;justify-content:center;align-items:center;gap:20px;padding:12px 0 14px}
.act{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 0 var(--line),0 10px 22px -10px rgba(25,5,66,.28);transition:transform .15s var(--ease)}
.act:active{transform:scale(.9)}
.act.big{width:72px;height:72px;background:var(--orange);color:var(--violet);box-shadow:0 14px 28px -10px rgba(255,125,32,.8)}
.act.sm{width:50px;height:50px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;gap:8px;min-height:60%}
.empty .eic{width:74px;height:74px;border-radius:26px;background:rgba(248,192,151,.45);display:grid;place-items:center;margin-bottom:10px;color:var(--violet)}
.empty h2{font-size:22px}
.empty p{color:var(--gray);font-size:15px;line-height:1.45;max-width:280px}
.empty .btns{display:grid;gap:10px;margin-top:16px;width:100%;max-width:260px}
.banner{margin:0 14px 10px;padding:11px 14px;border-radius:16px;background:rgba(248,192,151,.5);font-size:13px;line-height:1.4;display:flex;gap:10px;align-items:center}
/* rhythm */
.rsum{background:var(--violet);color:#fff;border-radius:28px;padding:22px;margin-top:18px;position:relative;overflow:hidden}
.rsum:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(32,201,195,.4),transparent 70%)}
.rsum small{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;position:relative}
.rsum .big{font-size:30px;font-weight:750;letter-spacing:-.03em;margin-top:8px;line-height:1.1;position:relative}
.rsum p{color:rgba(255,255,255,.68);font-size:14.5px;line-height:1.45;margin-top:10px;position:relative}
.rsum .wk{display:flex;gap:6px;margin-top:16px;position:relative}
.rsum .wk i{flex:1;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-style:normal;font-size:11px;color:rgba(255,255,255,.45);font-weight:600;transition:all .3s var(--ease)}
.rsum .wk i.on{background:var(--teal);color:var(--violet)}
.dayrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 10px 10px 16px;margin-bottom:8px}
.dayrow b{width:26px;font-size:15px}
.dayrow .slots{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{height:44px;border-radius:13px;background:var(--bg);font-size:13px;font-weight:600;color:var(--gray);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:all .2s var(--ease)}
.slot small{font-size:9.5px;font-weight:500;opacity:.75}
.slot.on{background:var(--violet);color:#fff}
.slot.on small{color:var(--teal);opacity:1}
.slot:active{transform:scale(.95)}
.note{font-size:12.5px;color:var(--gray);line-height:1.5;display:flex;gap:8px;margin-top:14px}
.note i{flex:none;margin-top:1px}
/* lists */
.li{display:flex;gap:14px;align-items:center;background:#fff;border-radius:22px;padding:14px;margin-bottom:10px;text-align:left;width:100%;transition:transform .15s var(--ease)}
.li:active{transform:scale(.985)}
.av{flex:none;border-radius:50%;overflow:hidden;background:var(--violet)}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-size:16.5px;letter-spacing:-.01em}
.li .mid span{display:block;font-size:13.5px;color:var(--gray);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid span.t{color:var(--violet)}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--gray)}
.pct{display:inline-grid;place-items:center;height:26px;padding:0 9px;border-radius:13px;background:rgba(248,192,151,.6);color:var(--violet);font-size:12.5px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 3px rgba(0,168,120,.25)}
.newtag{font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--violet);color:var(--teal);padding:3px 7px;border-radius:7px}
/* profile editing */
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--gray)}
.inp{width:100%;background:#fff;border:0;border-radius:16px;padding:15px 16px;outline:none;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.inp:focus{box-shadow:inset 0 0 0 2px var(--teal)}
textarea.inp{resize:none;min-height:92px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cnt{font-size:12px;color:var(--gray);text-align:right}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:8px;width:100%;text-align:left}
.sw div b{display:block;font-size:15px}
.sw div span{display:block;font-size:12.5px;color:var(--gray);margin-top:3px;line-height:1.35}
.tg{flex:none;width:50px;height:30px;border-radius:15px;background:rgba(25,5,66,.18);position:relative;transition:background .25s}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(25,5,66,.25);transition:transform .25s var(--ease)}
.tg.on{background:var(--emerald)}
.tg.on:after{transform:translateX(20px)}
.mecard{display:flex;gap:16px;align-items:center;margin-top:16px}
/* chat */
#chat{background:var(--bg);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s var(--ease);visibility:hidden}
#chat.open{transform:none;visibility:visible}
.chead{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.ib{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:var(--bg)}
.chead .nm{flex:1;min-width:0;text-align:left}
.chead .nm b{display:block;font-size:16px}
.chead .nm span{font-size:12.5px;color:var(--gray)}
.cwhy{margin:10px 14px 0;padding:11px 14px;border-radius:16px;background:var(--violet);color:#fff;font-size:13px;line-height:1.4;display:flex;gap:10px}
.cwhy i{color:var(--teal);flex:none;margin-top:1px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:10px 14px;border-radius:20px;font-size:15.5px;line-height:1.38;word-wrap:break-word;overflow-wrap:anywhere;animation:min .3s var(--ease)}
@keyframes min{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:var(--violet);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.msg small{display:block;font-size:10.5px;opacity:.5;margin-top:3px;text-align:right}
.sugs{display:flex;gap:8px;padding:0 14px 8px;overflow-x:auto}
.sugs .chip{white-space:nowrap}
.composer{display:flex;gap:10px;padding:8px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-top:1px solid var(--line);align-items:center}
.composer input{flex:1;min-width:0;border:0;background:var(--bg);border-radius:22px;padding:12px 16px;outline:none}
.sendb{width:44px;height:44px;border-radius:50%;background:var(--orange);color:var(--violet);display:grid;place-items:center;flex:none}
.sendb:active{transform:scale(.9)}
.chatempty{margin:auto;text-align:center;color:var(--gray);font-size:14px;max-width:240px;line-height:1.45}
/* sheet */
#bd{position:absolute;inset:0;background:rgba(25,5,66,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
#bd.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .4s var(--ease);z-index:61;padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(25,5,66,.2);margin:0 auto 16px}
.sheet-hero{height:200px;margin:0 -20px 0;overflow:hidden;position:relative;border-radius:0}
.sheet-hero svg{width:100%;height:100%}
.mm{display:flex;justify-content:center;align-items:center;padding:10px 0 4px}
.mm .av{border:4px solid var(--bg)}
.mm .av+.av{margin-left:-18px}
.center{text-align:center}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;background:#fff;border-radius:16px;margin-bottom:8px;font-weight:600;font-size:15px;text-align:left}
.opt.on{background:var(--violet);color:#fff}
.lnk{font-size:13.5px;color:var(--gray);font-weight:600;padding:10px 6px}
/* toast */
#toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--violet);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:100;max-width:88%;text-align:center;transition:transform .45s var(--ease);box-shadow:0 14px 30px -10px rgba(25,5,66,.4);display:flex;gap:8px;align-items:center;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#toast i{color:var(--teal);display:flex}
@media(max-height:700px){.hero{height:150px}.act{width:54px;height:54px}.act.big{width:62px;height:62px}.actions{padding:8px 0 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#onboard .inp,#auth .inp{color:var(--violet);-webkit-text-fill-color:var(--violet);caret-color:var(--orange)}
#onboard .inp::placeholder,#auth .inp::placeholder{color:var(--gray);opacity:.7;-webkit-text-fill-color:var(--gray)}
#onboard h3,#auth h3{color:rgba(255,255,255,.55)}
#onboard .field label,#auth .field label{color:rgba(255,255,255,.7)}
.hero img,.sheet-hero img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:16px;padding:4px;margin:22px 0 18px}
.seg button{flex:1;height:42px;border-radius:12px;font-weight:650;font-size:14.5px;color:rgba(255,255,255,.7);transition:all .2s var(--ease)}
.seg button.on{background:var(--teal);color:var(--violet)}
.ferr{font-size:12.5px;color:var(--orange);line-height:1.35}
.ferr:empty{display:none}
#auth .inp.bad{box-shadow:inset 0 0 0 2px var(--orange)}
.pw{position:relative}.pw .inp{padding-right:96px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:38px;padding:0 12px;font-size:13px;font-weight:650;color:var(--violet);background:var(--peach);border-radius:12px}
.demo{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(248,192,151,.14);font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.78);margin-top:18px}
.demo i{color:var(--peach);flex:none;margin-top:1px}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phs{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.phs img{width:100%;height:100%;object-fit:cover;display:block}
.phs.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;background:rgba(32,201,195,.1);box-shadow:none;border:2px dashed rgba(32,201,195,.75)}
.phs.empty b{font-size:14px}.phs.empty small{font-size:11.5px;opacity:.65}
.phi{width:40px;height:40px;border-radius:50%;background:var(--teal);color:var(--violet);display:grid;place-items:center}
.phtag{position:absolute;left:8px;top:8px;padding:4px 9px;border-radius:999px;background:rgba(25,5,66,.85);color:var(--teal);font-size:10.5px;font-weight:700}
.phx{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--violet);display:grid;place-items:center;box-shadow:0 4px 10px rgba(25,5,66,.25)}
.phr{position:absolute;left:8px;right:8px;bottom:8px;height:34px;border-radius:12px;background:var(--orange);color:var(--violet);font-weight:700;font-size:13px}
.phinfo{font-size:12.5px;color:var(--gray);margin-top:12px;line-height:1.4}
#onboard .phinfo{color:rgba(255,255,255,.55)}
.phrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.phfull{border-radius:22px;overflow:hidden;margin-top:16px;aspect-ratio:4/5;background:var(--violet)}
.phfull img{width:100%;height:100%;object-fit:cover;display:block}
.sheet-hero.tall{height:360px}
.car-t{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.car-t img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;scroll-snap-stop:always}
.car-n{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--violet);display:grid;place-items:center;box-shadow:0 4px 12px rgba(25,5,66,.3);z-index:2}
.car-n.l{left:10px}.car-n.r{right:10px}
.car-d{position:absolute;right:14px;bottom:18px;display:flex;gap:6px;z-index:2;background:rgba(25,5,66,.55);padding:7px 9px;border-radius:999px}
.car-d button{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.55);transition:all .25s var(--ease);padding:0}
.car-d button.on{width:24px;background:var(--orange)}

function empty(i,t,p,b){return'<div class="empty"><div class="eic">'+ic(i,32,1.6)+'</div><h2>'+t+'</h2><p>'+p+'</p>'+(b?'<div class="btns">'+b+'</div>':'')+'</div>'}
function bindSwipe(){
 var card=$('#card');if(!card)return;var sx=0,sy=0,dx=0,drag=false,down=false,pid=null;
 var sl=card.querySelector('.stamp.l'),sp=card.querySelector('.stamp.p');
 card.addEventListener('pointerdown',function(e){down=true;drag=false;sx=e.clientX;sy=e.clientY;dx=0;pid=e.pointerId});
 card.addEventListener('pointermove',function(e){if(!down)return;var mx=e.clientX-sx,my=e.clientY-sy;
  if(!drag&&Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my)*1.4){drag=true;try{card.setPointerCapture(pid)}catch(_){}card.style.transition='none';card.classList.remove('enter')}
  if(drag){dx=mx;card.style.transform='translateX('+dx+'px) rotate('+dx/26+'deg)';sl.style.opacity=Math.max(0,Math.min(1,dx/110));sp.style.opacity=Math.max(0,Math.min(1,-dx/110))}});
 function end(){if(!down)return;down=false;if(!drag)return;
  if(dx>110)fly(1);else if(dx<-110)fly(-1);else{card.style.transition='transform .35s cubic-bezier(.2,.8,.2,1)';card.style.transform='';sl.style.opacity=0;sp.style.opacity=0}
  setTimeout(function(){drag=false},50)}
 card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
 card.addEventListener('click',function(e){if(drag){e.stopPropagation();e.preventDefault()}},true)}
var flying=false;
function fly(dir){
 var card=$('#card');if(!card||flying)return;var id=card.dataset.id;flying=true;
 card.classList.remove('enter');card.style.transition='transform .38s cubic-bezier(.4,0,.8,.6),opacity .38s';
 card.style.transform='translateX('+dir*480+'px) rotate('+dir*18+'deg)';card.style.opacity='0';
 setTimeout(function(){flying=false;dir>0?doLike(id):doPass(id)},300)}

/* ============ Rhythm ============ */
function rhythmSummary(){
 var r=state.rhythm;if(!r.length)return{big:'Ритм не задан',p:'Отметь, когда ты обычно тренируешься в DDX Fitness. Мы покажем людей с похожим расписанием.',days:[]};
 var days={},sl={m:0,d:0,e:0};r.forEach(function(k){days[k.charAt(0)]=1;sl[k.charAt(1)]++});
 var dl=Object.keys(days).map(Number).sort(),best='e';['m','d','e'].forEach(function(k){if(sl[k]>sl[best])best=k});
 var adv=SLOTS.filter(function(s){return s.k===best})[0].adv,n=dl.length;
 var word=n===1?'день':n<5?'дня':'дней';
 var types={m:'Утренний ритм',d:'Дневной ритм',e:'Вечерний ритм'};
 var spread=Object.keys(sl).filter(function(k){return sl[k]>0}).length>2?'Тренируешься в разное время':'Чаще всего '+adv;
 return{big:n+' '+word+' в неделю · '+types[best].toLowerCase(),p:join(dl.map(function(d){return DAYS_FULL[d]}))+'. '+spread+'.',days:dl}}

function welcomeSeen(){try{return welcomed||localStorage.getItem(WKEY)==='1'}catch(e){return welcomed}}
function showWelcome(){
 $('#welcome').innerHTML='<div class="glow"></div><div class="ob-mid"><div class="wl-row">'+logo(36)+'<span class="wl-x" aria-hidden="true">\u00d7</span><img src="'+DDX_LOGO+'" alt="DDX Fitness"></div>'

 $('#welcome').classList.remove('hide')}
function routeStart(){
 var su=auth.session&&auth.users[auth.session];
 if(su)enterUser(su,false);
 else showAuth(Object.keys(auth.users).length?'login':'reg')}
A.welcomeStart=function(){welcomed=true;try{localStorage.setItem(WKEY,'1')}catch(e){}$('#welcome').classList.add('hide');routeStart()};
function togList(a,k){var i=a.indexOf(k);i>-1?a.splice(i,1):a.push(k)}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 var f=A[el.dataset.act];if(!f)return;
 f(el.dataset,e)});
document.addEventListener('input',function(e){
 var el=e.target;if(!el.dataset||!el.dataset.f)return;
 if(el.dataset.f==='bio'){state.me.bio=el.value;var c=$('#bioc');if(c)c.textContent=el.value.length+'/160';save()}
 else if(el.dataset.f==='name'){if(el.value.trim()){state.me.name=el.value.trim();save()}}
 else if(el.dataset.f==='age'){var av=parseInt(el.value,10);if(av>=18&&av<=99){state.me.age=av;save()}}});
document.addEventListener('change',function(e){
 var el=e.target;if(!el.dataset||!el.dataset.f)return;var f=el.dataset.f;
 if(el.closest('#onboard')){if(f==='age'){var q=parseInt(el.value,10);if(isNaN(q)||q<18||q>99){toast('Возраст — от 18 до 99',1);el.value=state.me.age}}return}
 if(f==='name'){if(!el.value.trim()){el.value=state.me.name;toast('Имя не может быть пустым');return}}
 if(f==='age'||f==='prefMin'||f==='prefMax'){var v=parseInt(el.value,10);if(isNaN(v))v=state.me[f];v=Math.max(18,Math.min(99,v));state.me[f]=v;el.value=v;
  if(state.me.prefMin>state.me.prefMax){if(f==='prefMin')state.me.prefMax=v;else state.me.prefMin=v}}
 if(f==='club')state.me.club=el.value;
 save();toast('Сохранено');if(f!=='bio'&&f!=='name')renderProfile()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();else if(chatId)closeChat()}});

/* ============ Старт ============ */

 resolveDelayed();
 if(welcomeSeen())routeStart();else showWelcome();
 setInterval(resolveDelayed,3000)}
start();
})();
